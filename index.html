<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Analytics 4 (property "Courtfest", stream "Courtfest site"), added 2026-10-19. Analytics cookies only: advertising storage stays denied. The first-party beacons in src/lib/analytics.ts keep running alongside. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RY9T4C7H4K"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', { ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'granted' });
      gtag('js', new Date());
      gtag('config', 'G-RY9T4C7H4K');
    </script>
    <meta name="description" content="Courtfest, le basket qui rassemble la ville. Open runs, tournois 5×5, musique et culture, toute l'année. Un mouvement Alpha 6 Sports né à Dakar." />
    <link rel="canonical" href="https://courtfest.com/" />

    <!-- Open Graph / social share (crawlers read the static HTML, so these are intentionally static & generic to the CourtFest brand) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CourtFest" />
    <meta property="og:url" content="https://courtfest.com/" />
    <meta property="og:title" content="Courtfest · Le basket qui rassemble la ville." />
    <meta property="og:description" content="Open runs, tournois 5×5, musique et culture. Toute l'année, dans toute la ville. Né à Dakar." />
    <meta property="og:image" content="https://courtfest.com/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Courtfest · Le basket qui rassemble la ville." />
    <meta name="twitter:description" content="Open runs, tournois 5×5, musique et culture. Toute l'année, dans toute la ville." />
    <meta name="twitter:image" content="https://courtfest.com/og-cover.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Courtfest landing redesign typefaces (Anton display + Archivo body) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Main event rich snippet: Courtfest Dakar 2026, Sunday 15 November 2026. All-day event, hence date-only start and end; add the venue once it is fixed; prices mirror src/pages/Buy.tsx. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SportsEvent",
      "name": "Courtfest Dakar 2026",
      "sport": "Basketball",
      "startDate": "2026-11-15",
      "endDate": "2026-11-15",
      "eventStatus": "https://schema.org/EventScheduled",
      "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
      "location": {
        "@type": "Place",
        "name": "Dakar",
        "address": { "@type": "PostalAddress", "addressLocality": "Dakar", "addressCountry": "SN" }
      },
      "organizer": { "@type": "Organization", "name": "Alpha 6 Sports", "url": "https://courtfest.com" },
      "image": "https://courtfest.com/og-cover.jpg",
      "description": "Courtfest à Dakar, dimanche 15 novembre 2026 : open runs 5×5, musique, streetwear, jeunesse.",
      "isAccessibleForFree": false,
      "offers": [
        { "@type": "Offer", "name": "Général", "price": "10000", "priceCurrency": "XOF", "url": "https://courtfest.com/buy", "availability": "https://schema.org/InStock" },
        { "@type": "Offer", "name": "VIP", "price": "15000", "priceCurrency": "XOF", "url": "https://courtfest.com/buy", "availability": "https://schema.org/InStock" }
      ]
    }
    </script>
    <!-- Static fallback; BrandProvider updates this to "{City} CourtFest · …" once the active edition loads. -->
    <title>CourtFest · Basket · Culture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
